<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="theme-color" content="#478ac9">
    <meta property="og:title" content="photo_list">
    <meta property="og:type" content="website">
    <meta data-intl-tel-input-cdn-path="intlTelInput/">

    <title>
        게시판 수정
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,700" rel="stylesheet">


    <link rel="stylesheet" th:href="@{/css/animate.css}">

    <link rel="stylesheet" th:href="@{/css/owl.carousel.min.css}">
    <link rel="stylesheet" th:href="@{/css/owl.theme.default.min.css}">
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}">

    <link rel="stylesheet" th:href="@{/css/aos.css}">

    <link rel="stylesheet" th:href="@{/css/ionicons.min.css}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.14.0/jquery.timepicker.min.css" rel="stylesheet">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <link rel="stylesheet" th:href="@{/css/flaticon.css}">

    <link rel="stylesheet" th:href="@{/mycss/mystyle.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .modal{
            position:absolute;
            width:700px;
            height:500px;
            /*background:black;*/
            top:50%;
            left:30%;
            display:none;
        }
    </style>

</head>


<body>
<div id="colorlib-page">
    <a href="#" class="js-colorlib-nav-toggle colorlib-nav-toggle"><i></i></a>
    <div th:replace="~{fragments/aside :: aside}"></div>

    <div id="colorlib-main">
        <section class="align-items-center justify-content-center m-5">
            <div class="row align-items-center justify-content-center">
                <h3 class="breadcrumbs"><span class="mr-2"><a href="">게시판</a></span></h3>
            </div>
            <div class="row align-items-center justify-content-center">
                <p><span class="mr-2">글 수정</span></p>
            </div>
        </section>

        <section class="align-items-center justify-content-center m-5">
            <div class="container row align-items-center justify-content-center">
                <div class="row align-items-center justify-content-center">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="row align-items-center" style="width: 330px">
                                <form method="post" th:action="@{/board/memorial-post/update}" th:object="${updateMemorialPostDto}" enctype="multipart/form-data">

                                    <input type="hidden" name="id" th:value="${id}">

                                        <label for="id_writer">닉네임: </label>
                                        <input type="text" id="id_writer" name="writer" maxlength="64" readonly
                                        th:value="${post.writer}"/>

                                        <label for="id_contents">내용:</label>
                                        <div data-field-id="id_contents" style="display: inline-block">
                                            <textarea th:text="${post.contents}" id="id_contents" name="contents" cols="40" rows="10"></textarea>
                                        </div>

                                    <th:block th:unless="${post.images.isEmpty}">
                                        <p>현재 첨부 이미지</p>
                                        <div class="mb-2" th:each="image : ${post.images}">
                                            <div th:text="${image.originalFilename}"></div>
                                            <img th:src="@{'/memorialPosts/images/' + ${image.path}}" alt=""/>

                                            <button type="button" class="btn btn-primary btn-sm mt-2 mb-2"
                                                    data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal"
                                                    th:attr="data-media-id=${image.id}, data-delete-url=@{/board/memorial-post/deleteImg/}">이미지 삭제</button>
                                        </div>



                                    </th:block>

                                    <label for="id_image">이미지 추가/변경:</label>
                                    <input type="file" accept="image/*" id="id_image" name="photo" multiple>

                                    <th:block th:unless="${post.videos.isEmpty}">
                                        <p>현재 첨부 동영상</p>
                                        <p class="mb-2" th:each="video : ${post.videos}">
                                            <video th:src="@{'/memorialPosts/videos/' + ${video.path}}" class="img-fluid" controls preload="metadata"></video>
                                            <button type="button" class="btn btn-primary btn-sm mt-2 mb-2"
                                                    data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal"
                                                    th:attr="data-media-id=${video.id}, data-delete-url=@{/board/memorial-post/deleteVideo/}">동영상 삭제</button>
                                        </p>
                                    </th:block>


                                    <p>
                                        <label for="id_video">동영상:</label>
                                        <input type="file" id="id_video" name="video" multiple>
                                    </p>
                                    <p>
                                        <label for="id_pw">비밀번호:</label>
                                        <input type="password" id="id_pw" name="pw" th:field="*{pw}">
                                        <div th:if="${#fields.hasErrors('pw')}" th:errors="*{pw}">비밀번호 Error</div>
                                    </p>
                                    <input type="submit" value="Save">
                                </form>

                                <div class="modal fade" id="modifyModal" tabindex="-1"
                                     aria-labelledby="modifyModalLabel" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">×</button>
                                                <h4 class="modal-title">닫기</h4>
                                            </div>
                                            <div class="modal-body">
                                                <div id="modify-div" title="Dialog Form">
                                                    <form th:action="@{/board/memorial-post/authcheck/}" method="post">
                                                        <label for="pw">비밀번호:</label>
                                                        <input id="pw" name="pwd" type="password" class="text ui-widget-content ui-corner-all">
                                                        <input type="submit" value="Submit">
                                                    </form>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-default" data-bs-dismiss="modal">닫기</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="modal fade" id="deleteConfirmationModal" tabindex="-1"
                                     aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">×</button>
                                                <h4 class="modal-title">삭제</h4>
                                            </div>
                                            <div class="modal-body">
                                                <div id="deletediv" title="Dialog Form">
                                                    <form id="deleteMediaForm" th:action="@{/board/memorial-post/deleteImg/}" method="post">
                                                        <label for="pwd">비밀번호:</label>
                                                        <input id="pwd" name="pwd" type="password" class="text ui-widget-content ui-corner-all">
                                                        <input id="postId" name="postId" type="hidden" th:value="${post.id}">
                                                        <input id="mediaId" name="mediaId" type="hidden">
                                                        <input id="submit" type="submit" value="Submit">
                                                    </form>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-default" data-bs-dismiss="modal">닫기</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="modal fade" th:id="not-working-message" tabindex="-1" role="dialog"
                                     >
                                    <div class="modal-dialog modal-dialog-centered" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">삭제 안됨</h5>
                                                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                                                    <span aria-hidden="true">&times;</span>
                                                </button>
                                            </div>
                                            <div class="modal-body">
                                                <p>비밀번호가 맞지 않아 삭제되지 않았습니다. </p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </div><!-- END COLORLIB-MAIN -->
</div><!-- END COLORLIB-PAGE -->

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/jquery-migrate-3.0.1.min.js}"></script>
<script th:src="@{/js/popper.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/jquery.easing.1.3.js}"></script>
<script th:src="@{/js/jquery.waypoints.min.js}"></script>
<script th:src="@{/js/jquery.stellar.min.js}"></script>
<script th:src="@{/js/owl.carousel.min.js}"></script>
<script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
<script th:src="@{/js/aos.js}"></script>
<script th:src="@{/js/jquery.animateNumber.min.js}"></script>
<script th:src="@{/js/bootstrap-datepicker.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.14.0/jquery.timepicker.min.js"></script>
<script th:src="@{/js/scrollax.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>




    <th:block th:if="${deleteIsSuccessful} == false">

        <script>

            $(function() {
                // $('#not-working-message').css('display', 'block')
                $('#not-working-message').modal('show');
                console.log("*****************************")

            })
        </script>

    </th:block>






<script>

    const delModal = document.getElementById('deleteConfirmationModal');
    delModal.addEventListener('show.bs.modal', function (event) {
        // 모달을 연 버튼(이미지 또는 동영상 삭제 버튼)
        const button = event.relatedTarget;
        const form = delModal.querySelector('#deleteMediaForm');

        form.action = button.getAttribute('data-delete-url');
        form.querySelector('#mediaId').value = button.getAttribute('data-media-id');
        form.querySelector('#pwd').value = '';
    });

</script>


</body>

</html>
